services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      SOCKET_SERVER_URL: http://socket:3002
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - public_uploads:/var/www/html/storage/app/public
    expose:
      - "80"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  socket:
    build:
      context: .
      dockerfile: Dockerfile.socket
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SOCKET_PORT: 3001
      SOCKET_BRIDGE_PORT: 3002
      SOCKET_BRIDGE_SECRET: ${SOCKET_BRIDGE_SECRET:?Set SOCKET_BRIDGE_SECRET in .env.production}
      SOCKET_LOCATION_MIN_INTERVAL_MS: ${SOCKET_LOCATION_MIN_INTERVAL_MS:-1000}
      SOCKET_PENDING_TRIP_TTL_MS: ${SOCKET_PENDING_TRIP_TTL_MS:-120000}
    expose:
      - "3001"
      - "3002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/status').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-https://tracktour.com}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-https://tracktour.com}
        VITE_PAYMONGO_PUBLIC_KEY: ${VITE_PAYMONGO_PUBLIC_KEY:?Set VITE_PAYMONGO_PUBLIC_KEY in .env.production}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      socket:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  public_uploads:
  caddy_data:
  caddy_config:
